# Headless service (clusterIP: None) giving Redis a stable DNS name for the StatefulSet pod
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: microservice
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Runs Redis as a StatefulSet so it keeps a stable identity and its own dedicated volume
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: microservice
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          # Enables AOF persistence so cached/queued data (used by GitLab) survives restarts
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          # Both probes just check that Redis responds to PING
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
  # Provisions a dedicated PersistentVolumeClaim per pod (redis-data-redis-0, etc.)
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
