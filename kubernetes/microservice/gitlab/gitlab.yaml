# Persistent storage for GitLab application data (repos, uploads, CI artifacts, etc.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: microservice
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# Persistent storage for GitLab configuration files (/etc/gitlab)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: microservice
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Persistent storage for GitLab logs (/var/log/gitlab)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-logs
  namespace: microservice
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Exposes GitLab's web UI (HTTP) and git-over-SSH ports outside the cluster via NodePort
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: microservice
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: ssh
      port: 22
      targetPort: 22
---
# Runs the GitLab CE server, backed by the external Postgres and Redis StatefulSets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: microservice
spec:
  replicas: 1
  # Recreate instead of RollingUpdate since GitLab holds an exclusive lock on its data volumes
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          ports:
            - containerPort: 80
            - containerPort: 22
          env:
            # Initial password for the GitLab root account
            - name: GITLAB_ROOT_PASSWORD
              value: gitlab-root-pass
            # Pulled from the postgres-secret created in postgres.yaml so both apps share one password
            - name: GITLAB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # Omnibus config: disables the bundled Postgres/Redis and points GitLab at the
            # in-cluster postgres/redis Services instead
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.local'
                postgresql['enable'] = false
                gitlab_rails['db_adapter'] = 'postgresql'
                gitlab_rails['db_encoding'] = 'utf8'
                gitlab_rails['db_host'] = 'postgres.microservice.svc.cluster.local'
                gitlab_rails['db_port'] = 5432
                gitlab_rails['db_username'] = 'gitlab'
                gitlab_rails['db_password'] = '$(GITLAB_POSTGRES_PASSWORD)'
                gitlab_rails['db_database'] = 'gitlabhq_production'
                redis['enable'] = false
                gitlab_rails['redis_host'] = 'redis.microservice.svc.cluster.local'
                gitlab_rails['redis_port'] = 6379
          volumeMounts:
            - name: gitlab-data
              mountPath: /var/opt/gitlab
            - name: gitlab-config
              mountPath: /etc/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
          # GitLab takes a while to boot (Rails + Puma + Sidekiq + Postgres migrations),
          # so probes use generous initial delays
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: gitlab-logs
          persistentVolumeClaim:
            claimName: gitlab-logs
